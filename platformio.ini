[platformio]
default_envs = t-qt-pro
libdeps_dir = .pio/libdeps-lilygo
boards_dir = vendor/T-QT/board

[env:t-qt-pro]
platform = espressif32@6.12.0
board = esp32-s3-t-qt-pro
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
    vendor/T-QT/lib
extra_scripts = pre:scripts/use_old_panel.py
build_flags =
    -D BOARD_HAS_PSRAM
